name: Build and release Flak1 for macOS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Check signing credentials
        id: credentials
        shell: bash
        env:
          CERT_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [[ -n "$CERT_P12" && -n "$CERT_PASSWORD" && -n "$SIGNING_IDENTITY" ]]; then echo "signing=true" >> "$GITHUB_OUTPUT"; else echo "signing=false" >> "$GITHUB_OUTPUT"; fi
          if [[ -n "$CERT_P12" && -n "$CERT_PASSWORD" && -n "$SIGNING_IDENTITY" && -n "$APPLE_ID" && -n "$APPLE_PASSWORD" && -n "$APPLE_TEAM" ]]; then echo "notary=true" >> "$GITHUB_OUTPUT"; else echo "notary=false" >> "$GITHUB_OUTPUT"; fi

      - name: Generate app icon
        run: |
          set -euo pipefail
          mkdir -p build/icon.iconset
          swift Scripts/MakeIcon.swift build/icon-1024.png
          for size in 16 32 64 128 256 512; do
            sips -z "$size" "$size" build/icon-1024.png --out "build/icon.iconset/icon_${size}x${size}.png" >/dev/null
          done
          sips -z 32 32 build/icon-1024.png --out build/icon.iconset/icon_16x16@2x.png >/dev/null
          sips -z 64 64 build/icon-1024.png --out build/icon.iconset/icon_32x32@2x.png >/dev/null
          sips -z 256 256 build/icon-1024.png --out build/icon.iconset/icon_128x128@2x.png >/dev/null
          sips -z 512 512 build/icon-1024.png --out build/icon.iconset/icon_256x256@2x.png >/dev/null
          sips -z 1024 1024 build/icon-1024.png --out build/icon.iconset/icon_512x512@2x.png >/dev/null
          iconutil -c icns build/icon.iconset -o build/AppIcon.icns
          test -s build/AppIcon.icns

      - name: Compile universal macOS app bundle
        shell: bash
        run: |
          set -euo pipefail
          APP="build/Flak1.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources" dist
          swiftc -parse-as-library -target arm64-apple-macosx13.0 Sources/Flak1App.swift -o build/Flak1-arm64 -framework SwiftUI -framework AppKit -framework UniformTypeIdentifiers
          swiftc -parse-as-library -target x86_64-apple-macosx13.0 Sources/Flak1App.swift -o build/Flak1-x86_64 -framework SwiftUI -framework AppKit -framework UniformTypeIdentifiers
          lipo -create build/Flak1-arm64 build/Flak1-x86_64 -output "$APP/Contents/MacOS/Flak1"
          cp build/AppIcon.icns "$APP/Contents/Resources/AppIcon.icns"
          cat > "$APP/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>CFBundleExecutable</key><string>Flak1</string>
          <key>CFBundleIdentifier</key><string>com.ales04718.flak1</string>
          <key>CFBundleName</key><string>Flak1</string>
          <key>CFBundleDisplayName</key><string>Flak1</string>
          <key>CFBundlePackageType</key><string>APPL</string>
          <key>CFBundleIconFile</key><string>AppIcon</string>
          <key>CFBundleShortVersionString</key><string>0.2.0</string>
          <key>CFBundleVersion</key><string>${GITHUB_RUN_NUMBER}</string>
          <key>LSMinimumSystemVersion</key><string>13.0</string>
          <key>LSApplicationCategoryType</key><string>public.app-category.developer-tools</string>
          <key>NSHighResolutionCapable</key><true/>
          </dict></plist>
          PLIST
          plutil -lint "$APP/Contents/Info.plist"
          file "$APP/Contents/MacOS/Flak1"
          lipo -verify_arch arm64 x86_64 "$APP/Contents/MacOS/Flak1"
          test -s "$APP/Contents/Resources/AppIcon.icns"

      - name: Import Developer ID certificate
        if: steps.credentials.outputs.signing == 'true'
        env:
          CERT_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/flak1.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          rm -f "$RUNNER_TEMP/certificate.p12"

      - name: Sign app with Developer ID
        if: steps.credentials.outputs.signing == 'true'
        env:
          SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          codesign --force --deep --options runtime --timestamp --sign "$SIGNING_IDENTITY" build/Flak1.app
          codesign --verify --deep --strict --verbose=2 build/Flak1.app

      - name: Sign preview build
        if: steps.credentials.outputs.signing != 'true'
        run: codesign --force --deep --sign - build/Flak1.app

      - name: Package and verify DMG
        run: |
          set -euo pipefail
          hdiutil create -volname "Flak1" -srcfolder build/Flak1.app -ov -format UDZO dist/Flak1-macOS.dmg
          hdiutil verify dist/Flak1-macOS.dmg
          shasum -a 256 dist/Flak1-macOS.dmg > dist/SHA256SUMS.txt

      - name: Notarize and staple DMG
        if: steps.credentials.outputs.notary == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          xcrun notarytool submit dist/Flak1-macOS.dmg --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM" --wait
          xcrun stapler staple dist/Flak1-macOS.dmg
          xcrun stapler validate dist/Flak1-macOS.dmg
          shasum -a 256 dist/Flak1-macOS.dmg > dist/SHA256SUMS.txt

      - name: Upload preview artifact
        if: steps.credentials.outputs.notary != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Flak1-macOS-preview-not-notarized
          path: |
            dist/Flak1-macOS.dmg
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      - name: Publish public GitHub Release
        if: steps.credentials.outputs.notary == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.0
          name: Flak1 v0.2.0
          target_commitish: ${{ github.sha }}
          body: |
            ## Flak1 v0.2.0

            Universal macOS app (Apple Silicon + Intel) with app icon, icy animated interface, searchable local dump viewer, import, copy, and export.

            Developer ID signed and Apple-notarized. Mount the DMG and drag Flak1.app into Applications.
          files: |
            dist/Flak1-macOS.dmg
            dist/SHA256SUMS.txt
          draft: false
          prerelease: false
          make_latest: true
